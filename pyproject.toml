[project]
name = "nyc-311-signal"
version = "0.1.0"
description = "Daily NYC 311 pipeline, Delayed-Request model and public dashboard"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.118",
]

[dependency-groups]
warehouse = [
    "snowflake-connector-python>=3.12",
]
dashboard = [
    "streamlit>=1.40",
    "snowflake-connector-python[pandas]>=3.12",
]
dev = [
    "boto3-stubs[s3]>=1.43.118",
    "moto[s3]>=5.2.4",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8",
]

[tool.uv]
package = false
default-groups = ["dev", "warehouse", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "warehouse/tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
files = ["ingestion", "warehouse", "dashboard", "tableau"]
