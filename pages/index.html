<!doctype html>
<!--
  hpa-code.github.io/nyc-311-signal: a stable link that forwards to the live
  dashboard. GitHub Pages serves only static files and the dashboard is a
  Streamlit server, so this page redirects. When the dashboard's URL changes
  (output dashboard_url of the Terraform environment that serves it), replace
  every https://dfez4wdq6h0ab.cloudfront.net/ below; .github/workflows/pages.yml
  publishes it.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NYC 311 Signal</title>
  <meta name="description" content="Daily NYC 311 pipeline, Delayed-Request model and public dashboard.">
  <meta http-equiv="refresh" content="0; url=https://dfez4wdq6h0ab.cloudfront.net/">
  <link rel="canonical" href="https://dfez4wdq6h0ab.cloudfront.net/">
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --link: #0969da; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1117; --fg: #fafafa; --muted: #9198a1; --link: #4493f8; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    p { color: var(--muted); margin: .25rem 0; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>NYC 311 Signal</h1>
    <p>Opening the dashboard…</p>
    <p><a id="go" href="https://dfez4wdq6h0ab.cloudfront.net/">Continue to the dashboard</a> ·
       <a href="https://github.com/hpa-code/nyc-311-signal">Source</a></p>
  </main>
  <script>
    const DASHBOARD = "https://dfez4wdq6h0ab.cloudfront.net/";
    location.replace(DASHBOARD + location.search + location.hash);
  </script>
</body>
</html>
